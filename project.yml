name: MacVideos
options:
  deploymentTarget:
    macOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_IDENTITY: 'Apple Development: MATT Weber (Q95DF7CUGG)'
    DEVELOPMENT_TEAM: 227GEZ2676
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: '27.0'
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) $(MAC_VIDEOS_KEYCHAIN_CONDITION)'
  configs:
    Release:
      ENABLE_HARDENED_RUNTIME: YES
      MAC_VIDEOS_KEYCHAIN_CONDITION: DATA_PROTECTION_KEYCHAIN
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DEBUG $(MAC_VIDEOS_KEYCHAIN_CONDITION)'
targets:
  MacVideosCore:
    type: framework
    platform: macOS
    sources: Sources/MacVideosCore
    dependencies:
      - sdk: Security.framework
      - sdk: CryptoKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.golfergeek.mac-videos.core
  MacVideos:
    type: application
    platform: macOS
    sources: Sources/MacVideos
    dependencies:
      - target: MacVideosCore
      - sdk: Network.framework
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.golfergeek.mac-videos
        CODE_SIGN_ENTITLEMENTS: '$(MAC_VIDEOS_KEYCHAIN_ENTITLEMENTS)'
        MAC_VIDEOS_KEYCHAIN_ENTITLEMENTS: ''
        PRODUCT_NAME: mac-videos
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          MAC_VIDEOS_KEYCHAIN_ENTITLEMENTS: Sources/MacVideos/Release.entitlements
    info:
      path: Sources/MacVideos/Info.plist
      properties:
        CFBundleDisplayName: mac-videos
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        NSCameraUsageDescription: Show your selected camera in the draggable recording bubble.
        NSMicrophoneUsageDescription: Record your selected microphone with your screen walkthrough.
        NSScreenCaptureUsageDescription: Record your selected display and camera bubble to a local video file.
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSCameraUseExternalDeviceType: true
        NSCameraUseContinuityCameraDeviceType: true
  MacVideosTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/MacVideos/YouTubeModel.swift
      - Sources/MacVideos/YouTubeAccount.swift
    dependencies:
      - target: MacVideosCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.golfergeek.mac-videos.tests
schemes:
  MacVideos:
    build:
      targets:
        MacVideos: all
        MacVideosTests: [test]
    test:
      targets: [MacVideosTests]
